[project]
name = "reask"
version = "0.1.0"
description = "A Claude Code skill that re-asks a pending question as a self-contained briefing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mikhail Nezhinsky" }]
requires-python = ">=3.11"
keywords = ["claude", "claude-code", "skill", "agent"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Nezhinskiy/reask"
Issues = "https://github.com/Nezhinskiy/reask/issues"

[project.scripts]
reask = "reask.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The repository's root SKILL.md is the single source; the wheel carries a copy inside the package.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "reask/SKILL.md"

[dependency-groups]
dev = ["pytest>=8"]
