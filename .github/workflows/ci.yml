name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The newest push to a pull request is the one that counts; a run on main is never cancelled,
# because it is the record that main is green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # A public repository: anyone can open a pull request, so no job runs unbounded.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter on Linux, and the newest on macOS and Windows, where home
        # directories, symbolic links and console encodings differ.
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Tests, with full line and branch coverage
        run: uv run pytest -q --cov
      - name: Skill package and version discipline
        run: uv run python -m scripts.check_skill
      - name: Build
        run: uv build
      - name: An installed wheel installs the skill
        # Tests import the checkout; only the built wheel says whether SKILL.md shipped.
        run: |
          uv run --isolated --no-project --with dist/*.whl reask install --skills-dir build/skills
          cmp build/skills/reask/SKILL.md skills/reask/SKILL.md

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy

  # The two install channels that read the repository itself rather than the wheel, each
  # installed into a scratch home. Versions are pinned so a release of either tool cannot turn
  # this red without a change here.
  skill:
    name: Skill installs (Skills CLI, plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: The Skills CLI installs exactly the skill folder
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          npx --yes skills@1.7.0 add . --global --agent claude-code --yes
          test "$(cd "$HOME/.claude/skills/reask" && find . -type f)" = "./SKILL.md"
          cmp "$HOME/.claude/skills/reask/SKILL.md" skills/reask/SKILL.md
      - name: The plugin and marketplace validate, and the plugin installs
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: |
          claude() { npx --yes @anthropic-ai/claude-code@2.1.284 "$@"; }
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin marketplace add ./
          claude plugin install reask@reask
          cmp "$CLAUDE_CONFIG_DIR"/plugins/cache/reask/reask/*/skills/reask/SKILL.md skills/reask/SKILL.md

  # Static security audit of every workflow: injection, excessive permissions, unpinned actions,
  # credential persistence, cache poisoning in release paths.
  workflows:
    name: Workflow security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: zizmor
        run: uvx zizmor@1.30.1 --pedantic --format github .github/workflows

  # The one check branch protection requires. A matrix renames its jobs whenever an entry
  # changes; requiring this instead keeps the ruleset stable while every job above still gates.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [tests, lint, skill, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
