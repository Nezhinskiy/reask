# Publishes from the tag through PyPI Trusted Publishing: a short-lived OIDC token instead of a
# stored API token, and build attestations so the artefacts say where they came from.
# See RELEASING.md for the repository settings this depends on.
name: release

on:
  push:
    # Final semver tags only. The version check below compares the tag to SKILL.md's version,
    # which a prerelease tag (v0.1.0-rc1) can never match.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One release at a time, and never cancelled: a half-finished publish is worse than a queued one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write       # attest-build-provenance signs through OIDC
      attestations: write   # and stores the attestation on the repository
      contents: read        # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0    # the whole history, to check the tag against main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # A pinned uv, and no cache on the release path: a cache written by any branch could
          # otherwise feed what gets published. The build backend is pinned in pyproject.toml.
          version: "0.12.20"
          enable-cache: false
          python-version: "3.13"
      - name: The tag is on main
        # Plugin and Skills CLI users install main, so a release must be a commit they have.
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install
        run: uv sync --locked
      - name: Skill package and version discipline, against the tag
        # A tag naming a version no source carries is the one release mistake PyPI will not let
        # you undo.
        run: uv run python -m scripts.check_skill --tag "$GITHUB_REF_NAME"
      - name: Tests
        run: uv run pytest -q --cov
      - name: Build the wheel and sdist
        run: uv build
      - name: Build the skill zip for claude.ai
        run: uv run python -m scripts.skill_zip dist/reask-skill.zip
      - name: Release notes from CHANGELOG.md
        run: uv run python -m scripts.release_notes "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            release-notes.md

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The human gate: nothing is uploaded until the pypi environment's required reviewer
    # approves, so a tag pushed by mistake stops here.
    environment:
      name: pypi
      url: https://pypi.org/project/reask/
    permissions:
      id-token: write       # Trusted Publishing: no stored API token anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Keep only the Python distributions
        run: rm dist/reask-skill.zip
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Independent of `publish`, so a failed upload does not cost the Release, and behind the same
  # environment, so a mistaken tag does not become a public Release either. One approval covers
  # both jobs.
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      contents: write       # create the Release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "reask ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
