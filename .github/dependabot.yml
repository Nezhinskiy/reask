version: 2
updates:
  # Every action is SHA-pinned with a version comment; Dependabot rewrites both, so the pins
  # do not rot silently.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # Development dependencies only: reask has no runtime dependencies.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev:
        patterns: ["*"]
