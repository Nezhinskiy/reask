schema_version: "1.1"
name: dead-code
description: "An easy yes/no: delete an unreferenced file. The re-ask should stay short."
tags: [reask]
runs: 3
context:
  history_file: history.jsonl
  add_dirs: [project]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "Not sure what you're asking. Ask again."
