schema_version: "1.1"
name: ci-setup
description: "Six CI questions; the user answers two and bounces the rest."
tags: [reask]
runs: 3
context:
  history_file: history.jsonl
  add_dirs: [project]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "1: GitHub Actions. 6: yes, PRs and pushes to main. The rest I don't follow, ask those again."
