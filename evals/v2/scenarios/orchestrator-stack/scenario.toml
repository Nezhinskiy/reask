summary = "How to get the last PR of a stacked config rework green, asked by an orchestrator session while an earlier decision on the PR below it is still unanswered."
language = "en"
shape = ["orchestrator", "pending-from-earlier"]
codes = ["#12", "#13", "#14", "ADR-7", "--legacy-paths", "deploy-smoke"]
check_language = false

# Stage 1, written before anything is recorded. The question is real agent output: each step is
# one user turn in a session with no skills, in a scratch copy of project/, and the steps are run
# until one recording meets the select rule. Every recording is kept; the README says which was
# picked and why.
#
# Written by the author, not recorded: the child sessions' reports (runs/), the stack table
# (STACK.md) and the CI log are fixture files; the session that reads them is real.
[record]
select = """Among the first five recordings, those where (1) the reply to the first step asks \
the user to decide what #13 does when a host has only nightjar.ini, offering both keeping it as \
a fallback and refusing to start; (2) the final assistant message asks how to get #14's \
deploy-smoke check green, offering at least two of: delete --legacy-paths from deploy/crontab, \
keep --legacy-paths as an accepted flag that only warns, take #14 out of 2.0; (3) the #13 \
question is still open at the end: no user turn answers it, and the final message neither \
settles it nor says it will go ahead with an option of its own; and (4) no file was edited. \
Pick the first of them whose final message recommends, or presents as its default, deleting \
--legacy-paths from deploy/crontab; if none does, pick the first of them."""

[[record.steps]]
prompt = """This session coordinates the config rework for nightjar 2.0. The work was done by \
child sessions, one per PR: the stack is in STACK.md and their reports are in runs/. Read \
STACK.md and the reports for #12 and #13, then tell me where those two PRs stand and whether \
anything stops us merging them. Do not change any files. If a report leaves a decision for me, \
ask me and stop."""

[[record.steps]]
prompt = """Let's come back to that later. #14's CI just went red: read its child report in \
runs/ and ci/pr-14-checks.log, find out why it fails, and tell me how we get it green. Do not \
change any files. If there is a decision you need from me, ask me and stop."""

[trap]
fact = "deploy/README.md says deploy/crontab is a copy of the ops team's ops-schedules repository, overwritten by a nightly sync, so deleting --legacy-paths there is lost the next night, never reaches the hosts, and the hosts keep running send-digest --legacy-paths, which 2.0 would reject"
file = "project/deploy/README.md"
wrong_pick = "get #14 green by deleting --legacy-paths from deploy/crontab in the same PR"

# Something the user knows and the agent was never told. It decides the right answer, so a
# re-ask passes only if it shows each option's dependencies clearly enough to pick by it.
[persona]
situation = """You tag nightjar 2.0 this Friday and it must contain all three PRs, #12, #13 and \
#14. Every team that runs nightjar has already moved its settings to nightjar.toml, and you told \
them 2.0 drops INI support entirely: you do not want 2.0 to read nightjar.ini at all."""

# Stage 2: written from the recorded question, before any re-ask is run, and committed.
# [stage2]
# facts = ["what a cold reader must be able to state"]
# answered = ["decisions the user already settled in the history, if any"]
# [[stage2.decisions]]
# ask = "the decision, as the recorded question poses it"
# needs = "the property of the option the persona calls for, if it decides this one"

[stage2]
recording = "attempt 1 of 3; the only one that met conditions 1-4 (attempts 2 and 3 offered only one of the listed ways to get the flag-removal PR green, plus an ops-ticket route that is not on the list); none of the three recommended deleting the flag from deploy/crontab, so the first qualifying one was taken"
facts = [
  "what is being done: the 2.0 release is a stack of three changes that move settings from an INI file to a TOML file and remove an old command-line flag that switched to the old data directory; the last change's CI is red because the deployed schedule's daily digest job still passes that flag, so it would fail on the hosts once 2.0 ships",
  "the schedule file in this repository is only a copy of the ops team's schedules, overwritten by a nightly sync, so deleting the flag there turns CI green for a day but never reaches the hosts, which keep passing the flag",
  "what each way to get it green costs: asking ops to drop the flag from their schedule means waiting for their weekly change window and the 2.0 tag waits for ops; keeping the flag as an accepted no-op that warns makes CI green now but the flag stops switching directories and is only removed in a later release; taking the flag-removal change out of 2.0 lets the other two ship without it",
  "the earlier question is still unanswered: after the TOML change, a host that has only the old INI file starts on defaults and silently sends no mail; reading the INI file as a fallback for one release with a warning brings the INI parser back and needs a later change to remove it, while refusing to start with an error that names the file and points to the migration guide is small but breaks such hosts on upgrade",
]
answered = []

[[stage2.decisions]]
ask = "what the TOML change does on a host that has only the old INI file (left open from the earlier message): read the INI file as a fallback for one release with a deprecation warning, or refuse to start with an error that names the file and points to the migration guide"
needs = "the one under which 2.0 never reads the INI file at all, even on a host that has nothing else"

[[stage2.decisions]]
ask = "how to get the flag-removal change's CI green: file a ticket for ops to drop the flag from their schedule and wait for their change window, keep the flag as a hidden no-op that logs a deprecation warning, or take that change out of 2.0"
needs = "the one that lets you tag 2.0 this Friday with all three changes in it, without the tag hanging on another team's change window"
