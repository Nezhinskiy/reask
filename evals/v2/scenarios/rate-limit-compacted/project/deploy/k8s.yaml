apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerly-api
spec:
  replicas: 6
  template:
    spec:
      containers:
        - name: api
          image: ledgerly/api:2026.10.30
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: api-db, key: url } }
---
apiVersion: v1
kind: Service
metadata:
  name: ledgerly-api
spec:
  type: ClusterIP
  selector: { app: ledgerly-api }
  ports: [{ port: 80, targetPort: 8080 }]
