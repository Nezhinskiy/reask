# old-dc: HAProxy on lb-1 (203.0.113.10), in front of the three app VMs.
# The OPS-133 shadow test (mirroring to k-east through the mirror agent) ended on 2026-10-31.

global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend api
    bind :443 ssl crt /etc/haproxy/certs/api.stagelark.example.pem
    default_backend app

backend app
    balance roundrobin
    option httpchk GET /healthz
    server app-1 10.0.1.11:8080 check
    server app-2 10.0.1.12:8080 check
    server app-3 10.0.1.13:8080 check
