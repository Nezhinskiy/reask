schema_version: "1.1"
name: reliability-plan
description: "Sprint planning from tickets, an ADR and an RFC referred to by code."
tags: [reask]
runs: 3
context:
  history_file: history.jsonl
  add_dirs: [project]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "Sorry, I stepped away and lost the thread. I don't understand what you're asking me. Ask it again."
